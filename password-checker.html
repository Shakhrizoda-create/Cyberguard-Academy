<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Strength Tester | CyberGuard Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="CSS-2">
</head>
<body>

<header>
  <h1>🔐 Password Strength Tester</h1>
  <h2 id="instruction">This section checks your password's security. Enter any password below.</h2>
</header>

<main>
  <input type="password" id="password-input" placeholder="Enter your password here">
  
  <!-- Feedback container with left and right columns -->
  <div id="feedback">
    <div id="feedback-left"></div>
    <div id="feedback-right"></div>
  </div>

  <button class="back">🏠 Back to Home</button>
</main>

<script>
const passwordInput = document.getElementById('password-input');
const backBtn = document.querySelector('.back');

// === Original password checks ===
function checkPassword(password) {
  const feedbacks = [];
  if(password.length < 6) feedbacks.push("⚠️ Too short! Minimum 6 characters.");
  if(password.length >= 6 && password.length < 10) feedbacks.push("ℹ️ Medium length, consider longer passwords.");
  if(/[A-Z]/.test(password)) feedbacks.push("✅ Contains uppercase letters."); else feedbacks.push("❌ No uppercase letters detected.");
  if(/[a-z]/.test(password)) feedbacks.push("✅ Contains lowercase letters."); else feedbacks.push("❌ No lowercase letters detected.");
  if(/\d/.test(password)) feedbacks.push("✅ Contains numbers."); else feedbacks.push("❌ No numbers detected.");
  if(/[\W_]/.test(password)) feedbacks.push("✅ Contains special characters."); else feedbacks.push("❌ No special characters detected.");
  return feedbacks;
}

// === Password strength & durability ===
function getPasswordStrength(password) {
  let score = 0;
  const tips = [];
  let probability = "";

  if(password.length >= 6) score += 20; else tips.push("Increase length to at least 6 characters");
  if(password.length >= 10) score += 20;
  if(/[A-Z]/.test(password)) score += 15; else tips.push("Add uppercase letters");
  if(/[a-z]/.test(password)) score += 15; else tips.push("Add lowercase letters");
  if(/\d/.test(password)) score += 15; else tips.push("Add numbers");
  if(/[\W_]/.test(password)) score += 15; else tips.push("Add special characters");

  let strengthText = "";
  if(score <= 30) strengthText = "Weak";
  else if(score <= 60) strengthText = "Medium";
  else if(score <= 80) strengthText = "Strong";
  else strengthText = "Very Strong";

  if(score <= 30) probability = "High probability of being hacked! 🔓";
  else if(score <= 60) probability = "Moderate probability of being hacked ⚠️";
  else if(score <= 80) probability = "Low probability of being hacked 🔒";
  else probability = "Very low probability of being hacked ✅";

  return {score, strengthText, tips, probability};
}

// === Display feedback in two columns ===
function showFeedback(feedbacks, strengthData=null) {
  const leftCol = document.getElementById('feedback-left');
  const rightCol = document.getElementById('feedback-right');
  leftCol.innerHTML = '';
  rightCol.innerHTML = '';

  const allFeedbacks = [...feedbacks];
  if(strengthData){
    const {score, strengthText, tips, probability} = strengthData;
    allFeedbacks.push(`💪 Strength: ${strengthText} (${score}/100)`);
    allFeedbacks.push(`⚠️ Durability: ${probability}`);
    tips.forEach(t => allFeedbacks.push(`💡 ${t}`));
  }

  const mid = Math.ceil(allFeedbacks.length / 2);
  const leftItems = allFeedbacks.slice(0, mid);
  const rightItems = allFeedbacks.slice(mid);

  leftItems.forEach((line, i) => {
    const p = document.createElement('p');
    p.classList.add('feedback-line');
    p.innerText = line;
    leftCol.appendChild(p);
    setTimeout(() => p.classList.add('show'), i * 200);
  });

  rightItems.forEach((line, i) => {
    const p = document.createElement('p');
    p.classList.add('feedback-line');
    p.innerText = line;
    rightCol.appendChild(p);
    setTimeout(() => p.classList.add('show'), i * 200);
  });
}

// === Input listener ===
passwordInput.addEventListener('input', e => {
  const password = e.target.value;
  const feedbacks = checkPassword(password);
  const strengthData = getPasswordStrength(password);
  showFeedback(feedbacks, strengthData);
});

// === Back button ===
backBtn.onclick = () => {
  window.location.href = "index.html";
};
</script>

</body>
</html>
