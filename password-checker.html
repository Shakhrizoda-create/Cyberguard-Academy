<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Strength Tester | CyberGuard Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Share Tech Mono', monospace;
    color: #ff4c4c;
    background: url('assets-2/cyber-strength-bg.png') no-repeat center center fixed;
    background-size: cover;
    text-align: center;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(4px);
    z-index: -1;
  }

  h1 {
    margin-top: 20px;
    font-size: 3em;
    text-shadow: 0 0 10px #ff2a2a;
  }

  h2 {
    font-size: 1.8em;
    margin-top: 20px;
    text-shadow: 0 0 8px #ff4c4c;
  }

  #instruction {
    margin-top: 10px;
    font-size: 1.2em;
    color: #ff7a7a;
    text-shadow: 0 0 5px #ff2a2a;
  }

  #password-input {
    margin-top: 20px;
    padding: 15px 20px;
    font-size: 1.2em;
    border: 2px solid #ff2a2a;
    border-radius: 8px;
    background: rgba(0,0,0,0.4);
    color: #ff4c4c;
    text-shadow: 0 0 5px #ff2a2a;
    outline: none;
    transition: 0.2s;
  }

  #password-input:focus {
    box-shadow: 0 0 15px #ff4c4c;
    border-color: #ff4c4c;
  }

  #feedback {
    margin-top: 25px;
    font-size: 1.2em;
  }

  .feedback-line {
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    margin: 5px 0;
  }

  .feedback-line.show {
    opacity: 1;
    transform: translateY(0);
  }

  .back {
    margin-top: 30px;
    padding: 10px 20px;
    border: 1px solid #ff4c4c;
    background: rgba(255,76,76,0.15);
    color: #ff4c4c;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
    text-shadow: 0 0 5px #ff2a2a;
  }

  .back:hover {
    transform: scale(1.1);
    box-shadow: 0 0 10px #ff4c4c;
  }
</style>
</head>
<body>

<header>
  <h1>🔐 Password Strength Tester</h1>
  <h2 id="instruction">This section checks your password's security. Enter any password below.</h2>
</header>

<main>
  <input type="password" id="password-input" placeholder="Enter your password here">
  <div id="feedback"></div>
  <button class="back">🏠 Back to Home</button>
</main>

<script>
const passwordInput = document.getElementById('password-input');
const feedbackDiv = document.getElementById('feedback');
const backBtn = document.querySelector('.back');

// Password feedback logic
function checkPassword(password) {
  const feedbacks = [];

  if(password.length < 6) feedbacks.push("⚠️ Too short! Minimum 6 characters.");
  if(password.length >= 6 && password.length < 10) feedbacks.push("ℹ️ Medium length, consider longer passwords.");
  if(/[A-Z]/.test(password)) feedbacks.push("✅ Contains uppercase letters.");
  else feedbacks.push("❌ No uppercase letters detected.");
  if(/[a-z]/.test(password)) feedbacks.push("✅ Contains lowercase letters.");
  else feedbacks.push("❌ No lowercase letters detected.");
  if(/\d/.test(password)) feedbacks.push("✅ Contains numbers.");
  else feedbacks.push("❌ No numbers detected.");
  if(/[\W_]/.test(password)) feedbacks.push("✅ Contains special characters.");
  else feedbacks.push("❌ No special characters detected.");

  return feedbacks;
}

// Animate feedback one by one
function showFeedback(feedbacks) {
  feedbackDiv.innerHTML = '';
  feedbacks.forEach((line, index) => {
    const p = document.createElement('p');
    p.classList.add('feedback-line');
    p.innerText = line;
    feedbackDiv.appendChild(p);
    setTimeout(() => { p.classList.add('show'); }, index * 300);
  });
}

passwordInput.addEventListener('input', (e) => {
  const password = e.target.value;
  const feedbacks = checkPassword(password);
  showFeedback(feedbacks);
});

// Back button
backBtn.onclick = () => {
  window.location.href = "index.html";
};
</script>

</body>
</html>
