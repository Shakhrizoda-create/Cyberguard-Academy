<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Strength Tester | CyberGuard Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🔐 Password Strength Tester</h1>
  <p id="instruction">This section checks your password's security. Enter any password below.</p>
</header>

<main>
  <input type="password" id="password-input" placeholder="Enter your password here">
  <div id="feedback-container"></div>
  <button class="back">🏠 Back to Home</button>
</main>

<script>
const passwordInput = document.getElementById('password-input');
const feedbackContainer = document.getElementById('feedback-container');
const backBtn = document.querySelector('.back');

// Password feedback logic
function checkPassword(password) {
  const feedbacks = [];

  if(password.length < 6) feedbacks.push("⚠️ Too short! Minimum 6 characters.");
  if(password.length >= 6 && password.length < 10) feedbacks.push("ℹ️ Medium length, consider longer passwords.");
  if(/[A-Z]/.test(password)) feedbacks.push("✅ Contains uppercase letters.");
  else feedbacks.push("❌ No uppercase letters detected.");
  if(/[a-z]/.test(password)) feedbacks.push("✅ Contains lowercase letters.");
  else feedbacks.push("❌ No lowercase letters detected.");
  if(/\d/.test(password)) feedbacks.push("✅ Contains numbers.");
  else feedbacks.push("❌ No numbers detected.");
  if(/[\W_]/.test(password)) feedbacks.push("✅ Contains special characters.");
  else feedbacks.push("❌ No special characters detected.");

  return feedbacks;
}

// Password strength/durability logic
function getPasswordStrength(password) {
  let score = 0;
  const tips = [];

  if(password.length >= 6) score += 20;
  else tips.push("Increase length to at least 6 characters");

  if(password.length >= 10) score += 20;

  if(/[A-Z]/.test(password)) score += 15;
  else tips.push("Add uppercase letters");

  if(/[a-z]/.test(password)) score += 15;
  else tips.push("Add lowercase letters");

  if(/\d/.test(password)) score += 15;
  else tips.push("Add numbers");

  if(/[\W_]/.test(password)) score += 15;
  else tips.push("Add special characters");

  let strengthText = "";
  if(score <= 30) strengthText = "Weak";
  else if(score <= 60) strengthText = "Medium";
  else if(score <= 80) strengthText = "Strong";
  else strengthText = "Very Strong";

  return {score, strengthText, tips};
}

// Show feedback with animation
function showFeedback(feedbacks) {
  feedbackContainer.innerHTML = '';
  feedbacks.forEach((line, index) => {
    const p = document.createElement('p');
    p.classList.add('feedback');
    p.innerText = line;
    feedbackContainer.appendChild(p);
    setTimeout(() => { p.classList.add('show'); }, index * 300);
  });
}

passwordInput.addEventListener('input', (e) => {
  const password = e.target.value;

  // Existing feedback
  const feedbacks = checkPassword(password);
  showFeedback(feedbacks);

  // New: password strength summary
  const {score, strengthText, tips} = getPasswordStrength(password);

  const strengthSummary = document.createElement('p');
  strengthSummary.style.marginTop = '10px';
  strengthSummary.style.fontWeight = 'bold';
  strengthSummary.innerHTML = `💪 Strength: ${strengthText} (${score}/100)`;
  feedbackContainer.appendChild(strengthSummary);

  tips.forEach((tip, idx) => {
    const tipLine = document.createElement('p');
    tipLine.classList.add('feedback');
    tipLine.innerText = "💡 " + tip;
    feedbackContainer.appendChild(tipLine);
    setTimeout(() => { tipLine.classList.add('show'); }, 300 + idx * 300);
  });
});

// Back button
backBtn.onclick = () => {
  window.location.href = "index.html";
};
</script>

</body>
</html>
