<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spot the Hack! | CyberFun</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .game-container {
      margin: 50px auto;
      max-width: 600px;
      background: #1a1a3d;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px #00c2ff55;
    }

    .message {
      display: block;
      background: #26265e;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 15px;
      margin: 10px 0;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s;
    }

    .message:hover {
      background: #2f2f80;
    }

    .result {
      font-size: 18px;
      margin-top: 15px;
    }

    .score {
      margin-top: 20px;
      color: #00ffcc;
    }
  </style>
</head>
<body>
  <header>
    <h1>🕵️‍♂️ Spot the Hack!</h1>
  </header>

  <main class="game-container">
    <h2 id="question">Question will appear here</h2>
    <div id="options"></div>
    <div id="feedback" class="result"></div>
    <div id="score" class="score"></div>
  </main>

  <script>
    const questions = [
      {
        text: "Your friend sends: 'Hey! Is this you in this video? 😂'",
        options: [
          { text: "https://youtube-video-funny.link", correct: false },
          { text: "https://short-video-check.net", correct: false },
          { text: "https://facebook-safe-check.site", correct: false },
          { text: "Just a normal text message with no link", correct: true }
        ]
      },
      {
        text: "You get an email: 'Your bank account is locked! Click here to unlock it'",
        options: [
          { text: "https://mybank-security-update.com", correct: false },
          { text: "https://secure.bank.com/account", correct: true },
          { text: "https://bank-unlock-alert.net", correct: false },
          { text: "https://bank-login-safe.co", correct: false }
        ]
      },
      // Add more questions here (you can create up to 20)
    ];

    let currentQuestion = 0;
    let score = 0;

    function showQuestion() {
      const q = questions[currentQuestion];
      document.getElementById("question").innerText = q.text;
      const optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";
      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.classList.add("message");
        btn.innerText = opt.text;
        btn.onclick = () => checkAnswer(opt.correct);
        optionsDiv.appendChild(btn);
      });
      document.getElementById("feedback").innerText = "";
    }

    function checkAnswer(correct) {
      const feedback = document.getElementById("feedback");
      if (correct) {
        feedback.innerHTML = "✅ You’re safe! That message is real.";
        score++;
      } else {
        feedback.innerHTML = "💀 You got hacked! That was a phishing message.";
      }

      currentQuestion++;
      if (currentQuestion < questions.length) {
        setTimeout(showQuestion, 1500);
      } else {
        document.getElementById("question").innerText = "Game Over!";
        document.getElementById("options").innerHTML = "";
        feedback.innerHTML = "🎯 Final Score: " + score + " / " + questions.length;
      }

      document.getElementById("score").innerText = "Score: " + score;
    }

    showQuestion();
  </script>
</body>
</html>
