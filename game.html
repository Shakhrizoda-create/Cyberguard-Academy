<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spot the Hack! | CyberGuard Academy</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    /* ===== GENERAL ===== */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Share Tech Mono', monospace;
      color: #00ffea;
      background: url('assets/hacker-bg.png') no-repeat center center fixed;
      background-size: cover;
      text-align: center;
    }

    /* Dark overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      z-index: -1;
    }

    h1 {
      margin-top: 20px;
      font-size: 3em;
      text-shadow: 0 0 10px #00fff2;
    }

    #question {
      font-size: 2em;
      margin-top: 30px;
      text-shadow: 0 0 8px #00fff2;
    }

    #options {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .message {
      border: 1px solid #0ff;
      background: rgba(0,0,0,0.45);
      padding: 15px 25px;
      margin: 10px;
      cursor: pointer;
      border-radius: 10px;
      font-size: 1.2em;
      transition: 0.2s;
    }

    .message:hover {
      background: rgba(0,255,217,0.2);
      transform: scale(1.1);
      box-shadow: 0 0 10px #00ffe5;
    }

    #feedback {
      margin-top: 20px;
      font-size: 1.6em;
    }

    #score {
      margin-top: 10px;
      font-size: 1.2em;
      color: #7afcff;
    }

    .back {
      margin-top: 30px;
      padding: 10px 20px;
      background: rgba(0,255,221,0.2);
      border: 1px solid #00ffe5;
      color: #00ffe5;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .back:hover {
      transform: scale(1.1);
      box-shadow: 0 0 10px #00ffe5;
    }

    /* MUTE BUTTON */
    #mute-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      padding: 10px 15px;
      background: rgba(0,255,221,0.25);
      border: 1px solid #00ffe5;
      color: #00ffe5;
      cursor: pointer;
      border-radius: 8px;
      text-shadow: 0 0 8px #00fff2;
    }
  </style>
</head>

<body>

  <!-- Background Music -->
  <audio id="bg-music" src="assets/music.mp3" loop></audio>

  <button id="mute-btn">🔊 Music On</button>

  <header>
    <h1>🕵️ Spot the Hack!</h1>
  </header>

  <main>
    <h2 id="question">Loading...</h2>
    <div id="options"></div>
    <div id="feedback"></div>
    <div id="score"></div>
    <button class="back" onclick="window.location.href='index.html'">🏠 Back to Home</button>
  </main>

  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <script>
    /* ====== MUSIC CONTROL ====== */
    const music = document.getElementById("bg-music");
    const muteBtn = document.getElementById("mute-btn");

    document.addEventListener("click", () => {
      if (music.paused) music.play();
    }, { once: true });

    muteBtn.onclick = () => {
      if (music.paused) {
        music.play();
        muteBtn.innerHTML = "🔊 Music On";
      } else {
        music.pause();
        muteBtn.innerHTML = "🔇 Music Off";
      }
    };


    /* ====== GAME LOGIC ====== */
    const questions = [
      { text: "Which of these messages is safe?",
        options: [
          { text: "Hey, is this you in this photo? 😳", correct: false },
          { text: "Yo, today we have the team meeting at 3 PM.", correct: true },
          { text: "Your account has been locked! Click here to fix it.", correct: false },
          { text: "Check out this video, you’re in it 😂", correct: false }
        ]
      },
      /* ... keep your remaining questions ... */
    ];

    let currentQuestion = 0;
    let score = 0;

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function showQuestion() {
      const q = questions[currentQuestion];
      document.getElementById("question").innerText = q.text;

      const optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";

      const shuffled = shuffle([...q.options]);

      shuffled.forEach(opt => {
        const btn = document.createElement("button");
        btn.classList.add("message");
        btn.innerText = opt.text;
        btn.onclick = () => checkAnswer(opt.correct);
        optionsDiv.appendChild(btn);
      });

      document.getElementById("feedback").innerHTML = "";
    }

    function celebrate() {
      confetti({ particleCount: 200, spread: 80 });
    }

    function skullRain() {
      confetti({
        particleCount: 80,
        spread: 60,
        emojis: ['💀'],
        emojiSize: 50
      });
    }

    function checkAnswer(correct) {
      const feedback = document.getElementById("feedback");

      if (correct) {
        feedback.innerHTML = "✔️ Safe!";
        score++;
      } else {
        feedback.innerHTML = "💀 Hacked!";
      }

      currentQuestion++;

      if (currentQuestion < questions.length) {
        setTimeout(showQuestion, 1200);
      } else {
        document.getElementById("question").innerText = "🎯 Game Over!";
        document.getElementById("options").innerHTML = "";

        feedback.innerHTML = "Your final score: " + score + " / " + questions.length;

        if (score >= 5) celebrate();
        else skullRain();
      }

      document.getElementById("score").innerText = "Score: " + score;
    }

    showQuestion();
  </script>

</body>
</html>
