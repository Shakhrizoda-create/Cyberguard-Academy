<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberFun Academy</title>

  <!-- Hacker font -->
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    /* ===== HACKER BACKGROUND ===== */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Share Tech Mono', monospace;
      color: #00ffe5;
      background: url('https://images.unsplash.com/photo-1508780709619-79562169bc64?q=80&w=1920')
        no-repeat center center fixed;
      background-size: cover;
      text-align: center;
    }

    /* Dark overlay with blur */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: -1;
    }

    /* ===== TITLE SECTION ===== */
    header {
      padding: 100px 20px;
    }

    header h1 {
      font-size: 3.5em;
      margin-bottom: 10px;
      color: #00ffe5;
      text-shadow: 0 0 10px #00fff2, 0 0 20px #00fff2;
    }

    header p {
      font-size: 1.4em;
      color: #9ffcff;
      text-shadow: 0 0 8px #00fff2;
    }

    /* ===== BUTTON GRID ===== */
    .button-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 350px;
      margin: 40px auto;
    }

    .start-btn {
      padding: 18px;
      font-size: 1.4em;
      border: 1px solid #00ffe5;
      background: rgba(0, 0, 0, 0.4);
      color: #00ffe5;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
      text-shadow: 0 0 5px #00fff2;
      backdrop-filter: blur(4px);
    }

    .start-btn:hover {
      transform: scale(1.07);
      background: rgba(0, 255, 221, 0.2);
      box-shadow: 0 0 12px #00ffe5;
    }
  </style>
</head>

<body>

  <header>
    <h1>CYBERFUN ACADEMY</h1>
    <p>Train. Learn. Protect. Become a Cyber Ninja 🥷💻</p>
  </header>

  <div class="button-container">
    <button class="start-btn" onclick="playClick(); window.location.href='game.html?v=200'">🕹 Start Game</button>
    <button class="start-btn" onclick="playClick();">🔐 Password Strength Test</button>
    <button class="start-btn" onclick="playClick();">🛡 Spot the Phish</button>
    <button class="start-btn" onclick="playClick();">🕵 OSINT Challenge</button>
    <button class="start-btn" onclick="playClick();">🎯 Beginner CTF</button>
  </div>

  <!-- Click Sound -->
  <audio id="click-sound" src="assets/click.mp3"></audio>

  <script>
    function playClick() {
      document.getElementById("click-sound").play();
    }
  </script>

</body>
</html>
