<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberFun Academy</title>
  <style>
    /* Background gradient for full page */
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(135deg, #FFDEE9, #B5FFFC, #F6FFB3);
      color: #333;
      margin: 0;
      text-align: center;
      padding: 0;
    }

    header {
      padding: 60px 20px;
      background: rgba(255, 255, 255, 0.2);
      border-bottom: 3px solid #333;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    header h1 {
      font-size: 3.5em;
      margin-bottom: 20px;
      color: #222;
      text-shadow: 3px 3px 5px rgba(0,0,0,0.3);
    }

    header p {
      font-size: 1.6em;
      margin-bottom: 40px;
      color: #444;
    }

    .start-btn {
      padding: 25px 50px;
      font-size: 1.8em;
      border-radius: 15px;
      background: #FF6B6B;
      color: white;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .start-btn:hover {
      transform: scale(1.1);
      background: #FF8787;
    }

    /* Optional fun shapes on page */
    .decor {
      position: absolute;
      border-radius: 50%;
      opacity: 0.3;
    }

    .decor1 { width: 150px; height: 150px; background: #FFD93D; top: 20px; left: 10%; }
    .decor2 { width: 100px; height: 100px; background: #6A4C93; top: 50%; right: 15%; }
    .decor3 { width: 200px; height: 200px; background: #4ECDC4; bottom: 10%; left: 30%; }
  </style>
</head>
<body>
  <!-- Fun floating shapes -->
  <div class="decor decor1"></div>
  <div class="decor decor2"></div>
  <div class="decor decor3"></div>

  <header>
    <h1>Welcome to CyberFun Academy!</h1>
    <p>Learn to spot hacks, play fun games, and stay safe online! 🕵️‍♂️💻</p>
    <button class="start-btn" onclick="window.location.href='game.html?v=6'">Start Playing</button>
  </header>
</body>
</html>
