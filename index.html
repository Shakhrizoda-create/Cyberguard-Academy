<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberFun Academy</title>
  <style>
    body {
      font-family: 'Comic Sans MS', sans-serif;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      color: #333;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: rgba(255, 255, 255, 0.3);
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    h1 {
      font-size: 3em;
      color: #fff;
      text-shadow: 2px 2px #333;
    }

    .start-btn {
      margin: 30px;
      padding: 20px 40px;
      font-size: 1.5em;
      border: none;
      border-radius: 12px;
      background-color: #ff6f61;
      color: white;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    .start-btn:hover {
      transform: scale(1.1);
      background-color: #ff3b2e;
    }

    .images-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    .images-row img {
      width: 150px;
      height: 150px;
      margin: 10px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.3s;
    }

    .images-row img:hover {
      transform: scale(1.2);
    }

    p {
      font-size: 1.2em;
      color: #fff;
      text-shadow: 1px 1px #333;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to CyberFun Academy!</h1>
    <p>Learn to spot hacks, play fun games, and stay safe online! 🕵️‍♂️💻</p>
    <button class="start-btn" onclick="window.location.href='game.html?v=4'">Start Playing</button>
  </header>

  <div class="images-row">
    <img src="https://cdn-icons-png.flaticon.com/512/906/906334.png" alt="Cyber Icon">
    <img src="https://cdn-icons-png.flaticon.com/512/2910/2910765.png" alt="Game Icon">
    <img src="https://cdn-icons-png.flaticon.com/512/2910/2910762.png" alt="Safety Icon">
    <img src="https://cdn-icons-png.flaticon.com/512/2910/2910766.png" alt="Learning Icon">
  </div>
</body>
</html>
