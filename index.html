<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CyberFun Academy</title>

  <!-- Hacker font -->
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <style>
    /* =========================
       General Body & Background
    ========================= */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Share Tech Mono', monospace;
      color: #00ffe5;
      text-align: center;
      background: url('assets/hacker-bg.png') no-repeat center center fixed;
      background-size: cover;
      position: relative;
      overflow: hidden;
    }

    /* Dark overlay + blur */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: -1;
    }

    /* =========================
       Header
    ========================= */
    header {
      padding: 100px 20px;
    }

    header h1 {
      font-size: 3.5em;
      margin-bottom: 10px;
      color: #00ffe5;
      text-shadow: 0 0 10px #00fff2, 0 0 20px #00fff2;
    }

    header p {
      font-size: 1.4em;
      color: #9ffcff;
      text-shadow: 0 0 8px #00fff2;
    }

    /* =========================
       Button Grid (NEW LAYOUT)
    ========================= */
    .button-container {
      display: grid;
      grid-template-columns: repeat(2, minmax(240px, 1fr));
      gap: 20px;
      max-width: 650px;
      margin: 20px auto 60px auto;
      padding: 0 20px;
      position: relative; /* so buttons appear above hex */
      z-index: 10;
    }

    /* button style */
    .start-btn {
      padding: 18px;
      font-size: 1.3em;
      border: 1px solid #00ffe5;
      background: rgba(0, 0, 0, 0.4);
      color: #00ffe5;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
      text-shadow: 0 0 5px #00fff2;
      backdrop-filter: blur(4px);
    }

    .start-btn:hover {
      transform: scale(1.08);
      background: rgba(0, 255, 221, 0.2);
      box-shadow: 0 0 15px #00ffe5;
    }

    /* Center the 5th button */
    .button-container button:nth-child(5) {
      grid-column: 1 / 3;
      justify-self: center;
      width: 60%;
    }
    
    /* =========================
       Honeycomb Cyber Glow Effect
    ========================= */
    .honeycomb {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; /* don't block clicks */
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;
      gap: 6px;
      padding: 40px;
      background: transparent;
      z-index: 0; /* behind content but above background */
    }

    /* Single hex cell */
    .hex {
      width: 60px;
      height: 52px;
      background: transparent;
      clip-path: polygon(
        25% 0%, 75% 0%, 100% 50%,
        75% 100%, 25% 100%, 0% 50%
      );
      border: 2px solid #00e5ff;
      box-shadow:
        0 0 8px #00e5ff,
        0 0 15px #00e5ff,
        0 0 25px #00e5ff;
      transform-origin: center;
      animation: pulseHex 3s infinite ease-in-out;
    }

    /* Offset every other row for honeycomb layout */
    .hex-row {
      display: flex;
    }
    .hex-row:nth-child(even) .hex {
      margin-left: 30px; /* half hex width */
    }

    /* Animation: scale in and out */
    @keyframes pulseHex {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          0 0 8px #00e5ff,
          0 0 15px #00e5ff,
          0 0 25px #00e5ff;
      }
      50% {
        transform: scale(0.85);
        box-shadow:
          0 0 4px #00a5cc,
          0 0 10px #00a5cc,
          0 0 15px #00a5cc;
      }
    }

    /* Stagger animation delay for each hex */
    .hex:nth-child(odd) {
      animation-delay: 0s;
    }
    .hex:nth-child(even) {
      animation-delay: 1.5s;
    }
  </style>
</head>

<body>
  <header>
    <h1>CYBERFUN ACADEMY</h1>
    <p>Train. Learn. Protect. Become a Cyber Ninja 🥷💻</p>
  </header>

  <div class="button-container">
    <button class="start-btn" onclick="playClick(); window.location.href='game.html?v=200'">🕹 Start Game</button>
    <button class="start-btn" onclick="playClick(); window.location.href='password-checker.html'">🔐 Password Strength Test</button>
    <button class="start-btn" onclick="playClick(); window.location.href='spot-the-phish.html'">🛡 Spot the Phish</button>
    <button class="start-btn" onclick="playClick(); alert('Coming soon!')">🕵 OSINT Challenge</button>
    <button class="start-btn" onclick="playClick(); alert('Coming soon!')">🎯 Beginner CTF</button>
  </div>

  <!-- Honeycomb background -->
  <div class="honeycomb" aria-hidden="true">
    <div class="hex-row">
      <div class="hex"></div><div class="hex"></div><div class="hex"></div><div class="hex"></div><div class="hex"></div>
    </div>
    <div class="hex-row">
      <div class="hex"></div><div class="hex"></div><div class="hex"></div><div class="hex"></div><div class="hex"></div>
    </div>
    <div class="hex-row">
      <div class="hex"></div><div class="hex"></div><div class="hex"></div><div class="hex"></div><div class="hex"></div>
    </div>
  </div>

  <!-- Click Sound -->
  <audio id="click-sound" src="assets/click.mp3"></audio>

  <script>
    function playClick() {
      const audio = document.getElementById("click-sound");
      if (audio) audio.play();
    }
  </script>
</body>
</html>
