<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spot the Phish Game</title>

    <link rel="stylesheet" href="spot-the-phish/spot-the-phish.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>

<body>

    <!-- START SCREEN -->
    <div id="start-screen">
        <h1 id="title">CYBERSECURITY EMAIL THREAT SIMULATOR</h1>

        <p id="intro-text">
            You have a budget of <strong>850,000 USD</strong>.  
            Identify whether each email is <span class="safe">SAFE</span>  
            or <span class="malicious">INFECTED / VIRUS</span>.  
            Wrong answers subtract money based on difficulty.  
            You have <strong>2:30 minutes</strong> to finish 10 questions.
        </p>

        <button id="start-btn">▶ START</button>
    </div>



    <!-- GAME UI -->
    <div id="game-ui" class="hidden">
        <!-- Timer -->
        <div id="timer-box">⏱ <span id="timer">1:30</span></div>

        <!-- Budget -->
        <div id="budget-box">💰 <span id="budget-amount">850,000 USD</span></div>

        <!-- Email Display -->
        <div id="email-container"></div>

        <!-- Buttons -->
        <div id="choice-buttons">
            <button id="infected-btn">INFECTED / VIRUS</button>
            <button id="safe-btn">SAFE / RELIABLE</button>
        </div>

        <!-- Penalty Animation -->
        <div id="penalty-display"></div>
    </div>



    <!-- END SCREEN -->
    <div id="end-screen" class="hidden">
        <h1 id="end-title">SIMULATION COMPLETE</h1>

        <p>Your remaining budget:</p>
        <p id="final-budget"></p>

        <button id="restart-btn">RESTART</button>
        <button id="back-btn">BACK</button>
    </div>



    <!-- AUDIO -->
    <audio id="bg-music" src="assets-3/music.mp3" preload="auto" loop></audio>
    <audio id="click-sound" src="assets-3/click.wav" preload="auto"></audio>
    <audio id="penalty-sound" src="assets-3/penalty.wav" preload="auto"></audio>

    <script src="spot-the-phish/spot-the-phish.js" defer></script>
</body>
</html>
