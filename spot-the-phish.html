<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spot the Phish | Cybersecurity Simulator</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="spot-the-phish/spot-the-phish.css">
</head>
<body>

    <!-- =========================
         INTRO SCREEN
    ========================= -->
    <div id="intro-screen">
        <h1 id="game-title">CYBERSECURITY EMAIL THREAT SIMULATOR</h1>
        <hr class="glow-line">
        <p id="intro-text">
            Welcome to the simulator!<br>
            Identify emails as safe or malicious to protect your organization's budget of <strong>850,000 USD</strong>.
        </p>
    </div>

    <!-- =========================
         START BUTTON SCREEN
    ========================= -->
    <div id="start-screen" class="hidden">
        <hr class="glow-line">
        <button id="big-start-btn">START</button>
    </div>

    <!-- =========================
         GAME UI
    ========================= -->
    <div id="game-ui" class="hidden">
        <div id="timer-box">⏱ <span id="timer">1:40</span></div>
        <div id="budget-box">💰 Budget: <span id="budget-amount">850,000 USD</span></div>

        <div id="email-container"></div>

        <div id="choice-buttons">
            <button id="infected-btn">INFECTED / VIRUS</button>
            <button id="safe-btn">SAFE / RELIABLE</button>
        </div>

        <div id="penalty-display"></div>
    </div>

    <!-- =========================
         END SCREEN
    ========================= -->
    <div id="end-screen" class="hidden">
        <h1 id="end-title">SIMULATION COMPLETE</h1>
        <p id="final-budget-text">Your remaining budget: <span id="final-budget"></span></p>
        <button id="restart-btn">RESTART</button>
        <button id="home-btn">BACK TO HOME</button>
    </div>

    <!-- Background music and sounds -->
    <audio id="bg-music" src="assets-3/music.mp3" loop></audio>
    <audio id="click-sound" src="assets-3/click.mp3"></audio>
    <audio id="penalty-sound" src="assets-3/penalty.mp3"></audio>

    <!-- JS -->
    <script src="spot-the-phish/spot-the-phish.js"></script>
</body>
</html>
